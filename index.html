<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>لوحة الإدارة - وضعيات التصوير الشعاعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 10px;
            overflow-y: auto;
        }
        
        .admin-login-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 15px;
        }
        .admin-login-screen.hidden { display: none; }
        .admin-login-box {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .admin-login-box i { font-size: 3rem; color: #667eea; margin-bottom: 10px; }
        .admin-login-box h2 { color: #2c3e50; margin-bottom: 5px; font-size: 1.5rem; }
        .admin-login-box p { color: #7f8c8d; margin-bottom: 20px; font-size: 0.9rem; }
        .admin-login-box .form-group { margin-bottom: 12px; text-align: right; }
        .admin-login-box label { display: block; font-weight: 600; margin-bottom: 5px; color: #2c3e50; font-size: 0.85rem; }
        .admin-login-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 0.95rem;
        }
        .admin-login-box input:focus { border-color: #667eea; outline: none; }
        .admin-login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .admin-login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .admin-login-error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .container { max-width: 100%; margin: 0 auto; }
        .main-content { display: none; }
        .main-content.show { display: block; }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }
        .header h1 { color: #2c3e50; font-weight: 800; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .header h1 i { color: #667eea; }
        .header .subtitle { color: #7f8c8d; font-size: 0.8rem; margin-top: 5px; }
        .logout-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }
        
        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: white;
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        .admin-tab {
            flex: 1;
            min-width: 90px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            color: #7f8c8d;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: #f8f9fa;
            border: 2px solid transparent;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .admin-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f2f6;
        }
        .card-title i { color: #667eea; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #2c3e50; font-size: 0.85rem; }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #f8f9fa;
            font-family: 'Cairo', sans-serif;
        }
        textarea { min-height: 60px; resize: vertical; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-secondary { background: #e9ecef; color: #2c3e50; }
        .btn-sm { padding: 6px 10px; font-size: 0.75rem; }
        
        .upload-group { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .upload-box {
            background: #f8f9fa;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            position: relative;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-box.has-image { border-color: #2ecc71; border-style: solid; }
        .upload-box i { font-size: 2rem; color: #bdc3c7; margin-bottom: 5px; }
        .upload-box .preview-img { max-width: 100%; max-height: 80px; object-fit: contain; border-radius: 8px; margin-top: 5px; }
        .upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-box .remove-image {
            position: absolute;
            top: 5px; right: 5px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px; height: 25px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        
        .status-message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .status-message.show { display: block; }
        .status-message.success { background: #d4edda; color: #155724; }
        .status-message.error { background: #f8d7da; color: #721c24; }
        .status-message.info { background: #d1ecf1; color: #0c5460; }
        
        .loading-spinner { display: none; text-align: center; padding: 20px; color: #7f8c8d; }
        .loading-spinner.show { display: block; }
        .loading-spinner i { font-size: 1.5rem; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .category-section { margin-bottom: 20px; }
        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .category-header i { font-size: 1.2rem; }
        .category-header .count-badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            margin-right: auto;
        }
        .category-positions { padding-right: 10px; }
        
        .position-item-admin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            border-right: 4px solid #667eea;
            flex-wrap: wrap;
            gap: 8px;
        }
        .position-actions { display: flex; gap: 5px; }
        
        .user-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-right: 4px solid #667eea;
        }
        .user-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .user-info-details { flex: 1; min-width: 150px; }
        .user-name { font-weight: 700; color: #2c3e50; font-size: 0.95rem; }
        .user-email { color: #7f8c8d; font-size: 0.8rem; }
        .user-status {
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.75rem;
            white-space: nowrap;
        }
        .status-none { background: #e9ecef; color: #7f8c8d; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        
        .subscription-info {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .subscription-info div {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
        }
        .subscription-info i { color: #2ecc71; }
        
        .user-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .user-actions .btn { flex: 1; min-width: 80px; }
        
        .edit-user-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .edit-user-modal.show { display: flex; }
        .edit-user-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .edit-user-content h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 15px;
        }
        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #bdc3c7;
        }
        .search-box input {
            width: 100%;
            padding: 10px 35px 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .filter-tools {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .filter-tools select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #f8f9fa;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: #7f8c8d;
        }
        .empty-state i { font-size: 2.5rem; color: #bdc3c7; margin-bottom: 10px; display: block; }
        
        /* نافذة خيارات التفعيل */
        .activation-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10001;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .activation-modal.show { display: flex; }
        .activation-content {
            background: white;
            border-radius: 16px;
            padding: 25px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .activation-content h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .activation-content p {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .activation-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .activation-option-btn {
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            background: #f8f9fa;
            color: #2c3e50;
        }
        .activation-option-btn:hover {
            border-color: #667eea;
            background: #eef0ff;
        }
        .activation-option-btn.three-months {
            background: #e8f5e9;
            border-color: #2ecc71;
            color: #155724;
        }
        .activation-option-btn.three-months:hover {
            background: #d4edda;
        }
        .activation-option-btn.one-year {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #0d47a1;
        }
        .activation-option-btn.one-year:hover {
            background: #bbdefb;
        }
        .activation-cancel-btn {
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            color: #2c3e50;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 0.9rem;
        }
        .activation-cancel-btn:hover {
            background: #dee2e6;
        }
        
        @media (min-width: 768px) {
            body { padding: 20px; }
            .container { max-width: 900px; }
            .form-grid { grid-template-columns: 1fr 1fr; }
            .upload-group { grid-template-columns: 1fr 1fr; }
            .filter-tools { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 2rem; }
            .card { padding: 25px; }
        }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div class="admin-login-screen" id="adminLoginScreen">
    <div class="admin-login-box">
        <i class="fas fa-shield-alt"></i>
        <h2>لوحة الإدارة</h2>
        <p>تسجيل الدخول للأدمن فقط</p>
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="adminEmail" placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="adminPassword" placeholder="••••••••">
        </div>
        <button class="admin-login-btn" id="adminLoginBtn">
            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
        </button>
        <div class="admin-login-error" id="adminLoginError"></div>
    </div>
</div>

<!-- الواجهة الرئيسية -->
<div class="main-content" id="mainContent">
    <div class="container">
        <div class="header">
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> خروج
            </button>
            <h1><i class="fas fa-cog"></i> لوحة الإدارة</h1>
            <p class="subtitle">إدارة الوضعيات والمستخدمين</p>
        </div>

        <div class="admin-tabs">
            <div class="admin-tab active" data-tab="positions">
                <i class="fas fa-image"></i> الوضعيات
            </div>
            <div class="admin-tab" data-tab="users">
                <i class="fas fa-users"></i> المستخدمين
            </div>
        </div>

        <!-- تبويب الوضعيات -->
        <div class="tab-content active" id="positionsTab">
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-plus-circle"></i>
                    <span id="formTitle">إضافة وضعية جديدة</span>
                </div>
                <form id="uploadForm">
                    <input type="hidden" id="editingPositionId" value="">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم الوضعية *</label>
                            <input type="text" id="posName" required>
                        </div>
                        <div class="form-group">
                            <label>المنطقة *</label>
                            <select id="regionSelect" required>
                                <option value="">-- اختر --</option>
                                <option value="SKULL">SKULL</option>
                                <option value="CHEST">CHEST</option>
                                <option value="ABDOMEN">ABDOMEN</option>
                                <option value="PELVIS">PELVIS</option>
                                <option value="KNEE">KNEE</option>
                                <option value="FOOT">FOOT</option>
                                <option value="HAND">HAND</option>
                                <option value="WRIST">WRIST</option>
                                <option value="ELBOW">ELBOW</option>
                                <option value="SHOULDER">SHOULDER</option>
                                <option value="ANKLE">ANKLE</option>
                                <option value="LEG">LEG</option>
                                <option value="FEMUR">FEMUR</option>
                                <option value="MANDIBLE">MANDIBLE</option>
                                <option value="CERVICAL SPINE">CERVICAL SPINE</option>
                                <option value="HUMERUS">HUMERUS</option>
                                <option value="FOREARM">FOREARM</option>
                                <option value="THORACIC VERTEBRAE">THORACIC VERTEBRAE</option>
                                <option value="LUMBOSACRAL SPINE">LUMBOSACRAL SPINE</option>
                                <option value="SACRUM COCCYX">SACRUM COCCYX</option>
                                <option value="PATELLA">PATELLA</option>
                            </select>
                        </div>
                        <div class="upload-group">
                            <div class="upload-box" id="realUploadBox">
                                <i class="fas fa-camera"></i>
                                <div>الصورة الحقيقية *</div>
                                <img class="preview-img" id="realPreview" style="display:none;">
                                <input type="file" id="realFileInput" accept="image/*">
                                <button type="button" class="remove-image" id="removeRealImage"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="upload-box" id="xrayUploadBox">
                                <i class="fas fa-x-ray"></i>
                                <div>الصورة الشعاعية *</div>
                                <img class="preview-img" id="xrayPreview" style="display:none;">
                                <input type="file" id="xrayFileInput" accept="image/*">
                                <button type="button" class="remove-image" id="removeXrayImage"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                        <div class="form-group"><label>KVP</label><input type="text" id="kvp"></div>
                        <div class="form-group"><label>MAS</label><input type="text" id="mas"></div>
                        <div class="form-group"><label>سنتر التصوير</label><input type="text" id="center"></div>
                        <div class="form-group"><label>الغرض</label><textarea id="purpose"></textarea></div>
                        <div style="display:flex; gap:10px;">
                            <button type="submit" class="btn btn-primary" style="flex:1;">
                                <i class="fas fa-save"></i> <span id="submitText">حفظ</span>
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancelEditBtn" onclick="cancelEdit()" style="flex:1; display:none;">
                                <i class="fas fa-times"></i> إلغاء التعديل
                            </button>
                        </div>
                    </div>
                </form>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <div class="card">
                <div class="card-title">
                    <i class="fas fa-list"></i>
                    <span>جميع الوضعيات (مصنفة حسب المنطقة)</span>
                </div>
                
                <div class="filter-tools">
                    <div class="form-group" style="margin-bottom:0;">
                        <select id="categoryFilter">
                            <option value="all">جميع المناطق</option>
                            <option value="SKULL">SKULL</option>
                            <option value="CHEST">CHEST</option>
                            <option value="ABDOMEN">ABDOMEN</option>
                            <option value="PELVIS">PELVIS</option>
                            <option value="KNEE">KNEE</option>
                            <option value="FOOT">FOOT</option>
                            <option value="HAND">HAND</option>
                            <option value="WRIST">WRIST</option>
                            <option value="ELBOW">ELBOW</option>
                            <option value="SHOULDER">SHOULDER</option>
                            <option value="ANKLE">ANKLE</option>
                            <option value="LEG">LEG</option>
                            <option value="FEMUR">FEMUR</option>
                            <option value="MANDIBLE">MANDIBLE</option>
                            <option value="CERVICAL SPINE">CERVICAL SPINE</option>
                            <option value="HUMERUS">HUMERUS</option>
                            <option value="FOREARM">FOREARM</option>
                            <option value="THORACIC VERTEBRAE">THORACIC VERTEBRAE</option>
                            <option value="LUMBOSACRAL SPINE">LUMBOSACRAL SPINE</option>
                            <option value="SACRUM COCCYX">SACRUM COCCYX</option>
                            <option value="PATELLA">PATELLA</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">

    // ==================== دالة موحدة لتحويل روابط الصور ====================
    function getCloudflareImageUrl(imageValue) {
        if (!imageValue || imageValue === '') return '';
        
        if (imageValue.startsWith(R2_WORKER_URL)) {
            return imageValue;
        }
        
        if (imageValue.includes('res.cloudinary.com') || imageValue.includes('cloudinary.com')) {
            try {
                const url = new URL(imageValue);
                const pathParts = url.pathname.split('/');
                const fileName = pathParts[pathParts.length - 1];
                
                if (fileName && (fileName.includes('.') || fileName.includes('-'))) {
                    return `${R2_WORKER_URL}/${fileName}`;
                }
            } catch (error) {
                console.warn('فشل تحويل رابط Cloudinary:', error);
            }
        }
        
        if (!imageValue.startsWith('http') && !imageValue.startsWith('https')) {
            return `${R2_WORKER_URL}/${imageValue}`;
        }
        
        if (imageValue.includes('firebasestorage.googleapis.com')) {
            try {
                const url = new URL(imageValue);
                const pathParts = url.pathname.split('/');
                const fileName = pathParts[pathParts.length - 1].split('?')[0];
                if (fileName) {
                    return `${R2_WORKER_URL}/${fileName}`;
                }
            } catch (error) {
                console.warn('فشل تحويل رابط Firebase:', error);
            }
        }
        
        return imageValue;
    }

    // ==================== دالة استخراج اسم الملف من الرابط ====================
    function extractFileNameFromUrl(url) {
        if (!url) return '';
        
        try {
            if (url.startsWith(R2_WORKER_URL)) {
                return url.replace(R2_WORKER_URL + '/', '');
            }
            
            const urlObj = new URL(url);
            const pathParts = urlObj.pathname.split('/');
            return pathParts[pathParts.length - 1].split('?')[0];
        } catch (error) {
            return url.split('/').pop();
        }
    }

    // ==================== رفع الصورة إلى Cloudflare R2 ====================
    async function uploadToCloudflareR2(file) {
        try {
            const formData = new FormData();
            formData.append('file', file);
            
            console.log('Uploading to:', R2_UPLOAD_URL);
            console.log('File:', file.name, file.type, file.size);
            
            const response = await fetch(R2_UPLOAD_URL, {
                method: 'POST',
                body: formData
            });
            
            console.log('Response status:', response.status);
            
            if (!response.ok) {
                const errorText = await response.text();
                console.error('Upload error response:', errorText);
                
                try {
                    const errorData = JSON.parse(errorText);
                    throw new Error(errorData.error || `فشل رفع الصورة (${response.status})`);
                } catch (parseError) {
                    throw new Error(`فشل رفع الصورة (${response.status}): ${errorText}`);
                }
            }
            
            const data = await response.json();
            console.log('Upload success:', data);
            
            if (!data.success || !data.url) {
                throw new Error('لم يتم استلام رابط الصورة من الخادم');
            }
            
            return data.url;
        } catch (error) {
            console.error('Upload to R2 failed:', error);
            
            if (error.message.includes('Failed to fetch')) {
                throw new Error('فشل الاتصال بخادم Cloudflare R2. تأكد من أن Worker يعمل ويدعم طلبات POST إلى /upload');
            }
            
            throw error;
        }
    }

    // ==================== حذف الصورة من Cloudflare R2 ====================
    async function deleteFromCloudflareR2(imageUrl) {
        try {
            const fileName = extractFileNameFromUrl(imageUrl);
            if (!fileName) return;
            
            console.log('Deleting from R2:', fileName);
            
            const response = await fetch(`${R2_WORKER_URL}/${fileName}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                console.warn('فشل حذف الصورة من Cloudflare R2:', fileName, response.status);
            }
        } catch (error) {
            console.warn('خطأ في حذف الصورة:', error);
        }
    }

    // تسجيل الدخول

    // رفع الصور
    function setupUploadBox(box, fileInput, preview, removeBtn, setFile) {
        box.addEventListener('click', (e) => {
            if (e.target !== removeBtn && !removeBtn.contains(e.target)) {
                fileInput.click();
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                setFile(file);
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                box.classList.add('has-image');
                removeBtn.style.display = 'flex';
            }
        });
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setFile(null);
            preview.style.display = 'none';
            preview.src = '';
            box.classList.remove('has-image');
            removeBtn.style.display = 'none';
            fileInput.value = '';
            if (box.id === 'realUploadBox') existingRealUrl = '';
            else existingXrayUrl = '';
        });
    }

    setupUploadBox(
        document.getElementById('realUploadBox'),
        document.getElementById('realFileInput'),

    function showStatus(message, type) {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.className = `status-message show ${type}`;
        statusMsg.textContent = message;
        setTimeout(() => { statusMsg.className = 'status-message'; }, 3000);
    }

    // حفظ الوضعية (إضافة أو تعديل)
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('posName').value.trim();
        const region = document.getElementById('regionSelect').value;
        
        if (!name || !region) {
            showStatus('يرجى ملء جميع الحقول المطلوبة', 'error');
            return;
        }
        
        if (!realFile && !existingRealUrl) {
            showStatus('يرجى رفع الصورة الحقيقية', 'error');
            return;
        }
        
        if (!xrayFile && !existingXrayUrl) {
            showStatus('يرجى رفع الصورة الشعاعية', 'error');
            return;
        }
        
        showStatus('جاري الحفظ...', 'info');
        
        try {
            let realImgUrl = existingRealUrl;
            let xrayImgUrl = existingXrayUrl;
            
            if (existingRealUrl) {
                realImgUrl = getCloudflareImageUrl(existingRealUrl);
            }
            if (existingXrayUrl) {
                xrayImgUrl = getCloudflareImageUrl(existingXrayUrl);
            }
            
            if (realFile) {
                showStatus('جاري رفع الصورة الحقيقية...', 'info');
                realImgUrl = await uploadToCloudflareR2(realFile);
            }
            if (xrayFile) {
                showStatus('جاري رفع الصورة الشعاعية...', 'info');

                purpose: document.getElementById('purpose').value,
                timestamp: Date.now()
            };
            
            if (editingPositionId) {
                await set(ref(db, `positions/${editingPositionId}`), data);
                showStatus('تم تحديث الوضعية بنجاح', 'success');
            } else {
                await push(ref(db, 'positions'), data);
                showStatus('تمت الإضافة بنجاح', 'success');

            cancelEdit();
            document.getElementById('uploadForm').reset();
            
        } catch (error) {

    // تحميل الوضعيات مع التصنيف
    function loadPositions() {
        const positionsList = document.getElementById('positionsList');
        positionsList.innerHTML = '<div class="loading-spinner show"><i class="fas fa-spinner"></i></div>';
        
        onValue(ref(db, 'positions'), (snapshot) => {
            const data = snapshot.val();
            allPositions = {};
            
            if (data) {

                    const pos = data[key];
                    allPositions[key] = {
                        ...pos,
                        realImg: getCloudflareImageUrl(pos.realImg),
                        xrayImg: getCloudflareImageUrl(pos.xrayImg)
                    };
                });
            }
            
            renderCategorizedPositions();
        });
    }

    // عرض الوضعيات مصنفة
    function renderCategorizedPositions() {
        const positionsList = document.getElementById('positionsList');
        const selectedCategory = document.getElementById('categoryFilter').value;
        const searchTerm = document.getElementById('positionSearch').value.toLowerCase();
        
        const categorized = {};
        Object.keys(allPositions).forEach(key => {
            const pos = allPositions[key];
            const region = pos.region || 'OTHER';
            
            if (selectedCategory !== 'all' && region !== selectedCategory) return;
            if (searchTerm && pos.name && !pos.name.toLowerCase().includes(searchTerm)) return;
            
            if (!categorized[region]) categorized[region] = [];
            categorized[region].push({ id: key, ...pos });
        });
        
        positionsList.innerHTML = '';
        
        const regions = Object.keys(categorized).sort();
        
        if (regions.length === 0) {
            positionsList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد وضعيات</p></div>';
            return;

            });

    // تحميل المستخدمين مع عرض معلومات الاشتراك

                    let subscriptionInfoHtml = '';
                    if (status === 'approved' && user.subscription) {

                        const price = user.subscription.price || '10,000 دينار عراقي';
                        
                        subscriptionInfoHtml = `
                            <div class="subscription-info">
                                <div><i class="fas fa-calendar-check"></i> تاريخ البدء: ${startDate}</div>
                                <div><i class="fas fa-calendar-times"></i> تاريخ الانتهاء: ${endDate}</div>
                                <div><i class="fas fa-money-bill"></i> السعر: ${price}</div>
                            </div>
                        `;
                    }
                    
                    let userAvatarHtml = '';
                    if (user.avatar || user.profileImage || user.photoURL) {
                        const avatarUrl = getCloudflareImageUrl(user.avatar || user.profileImage || user.photoURL);
                        userAvatarHtml = `<img src="${avatarUrl}" alt="صورة المستخدم" style="width:40px; height:40px; border-radius:50%; object-fit:cover;" onerror="this.style.display='none'">`;
                    } else {
                        userAvatarHtml = `<div class="user-avatar">${(user.username || user.email || '?').charAt(0).toUpperCase()}</div>`;
                    }
                    
                    const div = document.createElement('div');
                    div.className = 'user-card';
                    div.innerHTML = `
                        <div class="user-header">
                            ${userAvatarHtml}
                            <div class="user-info-details">
                                <div class="user-name">${user.username || 'بدون اسم'}</div>
                                <div class="user-email">${user.email || 'بدون بريد'}</div>
                            </div>
                            <span class="user-status ${statusClass}">${statusText}</span>
                        </div>
                        ${subscriptionInfoHtml}
                        <div class="user-actions">
                            <button class="btn btn-primary btn-sm" onclick="openEditUser('${key}')">
                                <i class="fas fa-edit"></i> تعديل
                            </button>
                            <button class="btn btn-success btn-sm" onclick="showActivationOptions('${key}')">
                                <i class="fas fa-check"></i> تفعيل
                            </button>
                            <button class="btn btn-warning btn-sm" onclick="cancelSubscription('${key}')">
                                <i class="fas fa-ban"></i> إلغاء
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser('${key}')">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </div>
                    `;
                    usersList.appendChild(div);
                });
            } else {
                usersList.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><p>لا يوجد مستخدمين مسجلين</p></div>';
            }
        }).catch((error) => {
            console.error('Load users error:', error);
            usersList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>خطأ في التحميل</p></div>';
        });
    }

    // البحث عن مستخدم
    document.getElementById('userSearchInput').addEventListener('input', function(e) {
        loadUsers(e.target.value.trim());
    });

    // فتح نافذة خيارات التفعيل
    window.showActivationOptions = function(userId) {
        pendingActivationUserId = userId;
        activationModal.classList.add('show');
    };

    // إغلاق نافذة خيارات التفعيل
    window.closeActivationModal = function() {
        activationModal.classList.remove('show');
        pendingActivationUserId = null;
    };

    // تأكيد التفعيل حسب المدة المختارة
    window.confirmActivation = async function(duration) {
        if (!pendingActivationUserId) return;
        
        const userId = pendingActivationUserId;
        const durationText = duration === '3months' ? '3 أشهر' : 'سنة';
        
        closeActivationModal();
        
        if (confirm(`تأكيد تفعيل الاشتراك لمدة ${durationText}؟`)) {
            try {
                const startDate = new Date();
                const endDate = new Date();
                
                if (duration === '3months') {
                    endDate.setMonth(endDate.getMonth() + 3);
                } else {
                    endDate.setFullYear(endDate.getFullYear() + 1);
                }
                
                await set(ref(db, `users/${userId}/subscription`), {
                    status: 'approved',
                    startDate: startDate.toISOString(),
                    endDate: endDate.toISOString(),
                    price: '10,000 دينار عراقي',
                    duration: duration === '3months' ? '3months' : '1year',
                    activatedAt: new Date().toISOString()
                });
                alert(`✅ تم تفعيل الاشتراك لمدة ${durationText}`);
                loadUsers();
            } catch (error) {
                console.error('Activate subscription error:', error);
                alert('❌ خطأ: ' + error.message);
            }
        }
    };

    // فتح نافذة التعديل
    window.openEditUser = function(userId) {
        const user = allUsers[userId];
        if (!user) return;
        
        document.getElementById('editUserId').value = userId;
        document.getElementById('editUsername').value = user.username || '';
        document.getElementById('editUserEmail').value = user.email || '';
        document.getElementById('editSubscriptionStatus').value = user.subscription?.status || 'none';
        
        const status = user.subscription?.status;
        if (status === 'approved') {
            document.getElementById('subscriptionDateGroup').style.display = 'block';
            document.getElementById('subscriptionEndDateGroup').style.display = 'block';
            if (user.subscription.startDate) {
                const startDate = new Date(user.subscription.startDate);
                document.getElementById('editSubscriptionStartDate').value = startDate.toISOString().split('T')[0];
            }
            if (user.subscription.endDate) {
                const endDate = new Date(user.subscription.endDate);
                document.getElementById('editSubscriptionEndDate').value = endDate.toISOString().split('T')[0];
            }
        } else {
            document.getElementById('subscriptionDateGroup').style.display = 'none';
            document.getElementById('subscriptionEndDateGroup').style.display = 'none';
        }
        
        document.getElementById('editUserModal').classList.add('show');
    };

    window.closeEditUserModal = function() {
        document.getElementById('editUserModal').classList.remove('show');
    };

    window.toggleDateFields = function() {
        const status = document.getElementById('editSubscriptionStatus').value;
        if (status === 'approved') {
            document.getElementById('subscriptionDateGroup').style.display = 'block';
            document.getElementById('subscriptionEndDateGroup').style.display = 'block';
        } else {
            document.getElementById('subscriptionDateGroup').style.display = 'none';
            document.getElementById('subscriptionEndDateGroup').style.display = 'none';
        }
    };

    window.saveUserEdit = async function() {
        const userId = document.getElementById('editUserId').value;
        const username = document.getElementById('editUsername').value.trim();
        const email = document.getElementById('editUserEmail').value.trim();
        const status = document.getElementById('editSubscriptionStatus').value;
        
        if (!username || !email) {
            alert('يرجى ملء جميع الحقول');
            return;
        }
        
        try {
            const user = allUsers[userId];
            const updates = {
                username: username,
                email: email
            };
            
            if (user.subscription) {
                updates.subscription = { ...user.subscription, status: status };
            } else {
                updates.subscription = { status: status };
            }
            
            if (status === 'approved') {
                const startDate = document.getElementById('editSubscriptionStartDate').value;
                const endDate = document.getElementById('editSubscriptionEndDate').value;
                if (startDate) updates.subscription.startDate = new Date(startDate).toISOString();
                if (endDate) updates.subscription.endDate = new Date(endDate).toISOString();
                updates.subscription.price = '10,000 دينار عراقي';
            }
            
            await set(ref(db, `users/${userId}`), updates);
            alert('✅ تم حفظ التعديلات');
            closeEditUserModal();
            loadUsers();
        } catch (error) {
            console.error('Save user error:', error);
            alert('❌ خطأ: ' + error.message);
        }
    };

    window.cancelSubscription = async function(userId) {
        if (confirm('إلغاء اشتراك هذا المستخدم؟')) {
            try {
                await set(ref(db, `users/${userId}/subscription/status`), 'none');
                await set(ref(db, `users/${userId}/subscription/cancelledAt`), new Date().toISOString());
                alert('✅ تم إلغاء الاشتراك');
                loadUsers();
            } catch (error) {
                console.error('Cancel subscription error:', error);
                alert('❌ خطأ: ' + error.message);
            }
        }
    };

    window.deleteUser = async function(userId) {
        if (confirm('هل أنت متأكد من حذف هذا المستخدم؟ لن يتمكن من تسجيل الدخول مرة أخرى!')) {
            if (confirm('تأكيد نهائي: سيتم حذف المستخدم نهائياً!')) {
                try {
                    await remove(ref(db, `users/${userId}`));
                    alert('✅ تم حذف المستخدم');
                    loadUsers();
                } catch (error) {
                    console.error('Delete user error:', error);
                    alert('❌ خطأ: ' + error.message);
                }
            }
        }
    };

    // إغلاق نافذة خيارات التفعيل عند النقر خارجها
    activationModal.addEventListener('click', function(e) {
        if (e.target === activationModal) {
            closeActivationModal();
        }
    });

    // مراقبة حالة المستخدم
    onAuthStateChanged(auth, (user) => {
        if (user && user.email === ADMIN_EMAIL) {
            adminLoginScreen.classList.add('hidden');
            mainContent.classList.add('show');
            loadPositions();
        } else {
            adminLoginScreen.classList.remove('hidden');
            mainContent.classList.remove('show');
            adminPassword.value = '';
        }
    });
</script>

</body>
</html>
